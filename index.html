    <script>
      (function() {
        // Prevent browser extension errors from breaking the page or triggering error listeners
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('fetch') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.message &&
            event.reason.message.indexOf('fetch') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // Ensure window.fetch has both a getter and a setter so that extensions/interceptors
        // that assign window.fetch do not throw:
        // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        try {
          var originalFetch = window.fetch;
          var activeFetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;

          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(val) {
              activeFetch = val;
            }
          });
        } catch (e) {}

        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return activeFetch || protoFetch;
              },
              set: function(val) {
                activeFetch = val;
              }
            });
          }
        } catch (e) {}
      })();
    </script>
